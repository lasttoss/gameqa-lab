name: qa

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit suite
        run: make test
      - name: Fixtures are reproducible
        run: make fixtures-check
      - name: Gate passes on the recorded fixtures
        run: make demo
      - name: Audio bank gate
        run: make audio
      - name: Gate closes when limits tighten
        run: make guard
      - name: Airflow scripts compile without airtest installed
        run: |
          python -m py_compile flows/slot_smoke.py
          bash -n scripts/run_flow.sh
          bash -n scripts/collect.sh
          bash -n scripts/make_video.sh
          echo "flows and scripts parse; the device run itself is not part of CI"
      - name: HTML report
        run: make report
      - name: Report is a single self-contained file
        run: |
          test -s out/report.html
          ! grep -qE 'https?://|cdn\.' out/report.html
          grep -q "GATE PASSED" out/report.html
          echo "report: $(wc -c < out/report.html) bytes, no external references"
      - uses: actions/upload-artifact@v4
        with:
          name: qa-report-py${{ matrix.python-version }}
          path: out/report.html
      - name: Device flow cannot pass without a device
        run: |
          set +e
          python flows/slot_smoke.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "flow returned 0 with no device attached — that is a lie"; exit 1
          fi
          echo "flow exited $code with no device and no airtest: it cannot look like a pass"
